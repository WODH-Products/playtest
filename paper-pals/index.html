#stage { position: fixed; inset: 0; z-index: 1; }
#col { position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: min(100vw, 480px); z-index: 2; pointer-events: none;
  display: flex; flex-direction: column;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
#hud { display: flex; flex-direction: column; align-items: center; gap: 8px; }
#boardArea { flex: 1; min-height: 0; margin: 8px 0 10px; }
#caption { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 128px); transform: translateX(-50%) scale(0.8); opacity: 0; z-index: 3; pointer-events: none;
  background: var(--paper); color: var(--ink); font-weight: 700; font-size: 22px; padding: 8px 18px; border-radius: 14px; box-shadow: 0 4px 0 rgba(200,140,90,0.45); white-space: nowrap; transition: opacity .25s, transform .35s cubic-bezier(.3,1.5,.5,1); }
#caption.on { opacity: 1; transform: translateX(-50%) scale(1); }
.banner { position: relative; padding: 4px 30px 6px; background: var(--paper); font-weight: 700; font-size: 34px; line-height: 1; letter-spacing: 0.5px;
  clip-path: polygon(0 8%, 4% 0, 10% 6%, 18% 1%, 27% 7%, 36% 0, 47% 5%, 58% 0, 68% 6%, 79% 1%, 88% 7%, 96% 0, 100% 9%, 98% 52%, 100% 92%, 93% 100%, 82% 94%, 71% 100%, 60% 95%, 49% 100%, 38% 94%, 27% 100%, 16% 95%, 6% 100%, 0 91%, 2% 48%);
  filter: drop-shadow(0 3px 0 rgba(150,70,40,0.25)); transform: rotate(-1.5deg); }
.banner b { color: var(--ink); -webkit-text-stroke: 2px #fff; paint-order: stroke fill; }
.banner b + b { color: var(--pink); margin-left: 8px; }
.flag { position: absolute; top: 50%; width: 0; height: 0; border-top: 13px solid transparent; border-bottom: 13px solid transparent; transform: translateY(-50%); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; }
.pill { display: flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 12px; background: var(--lilac); font-weight: 600; font-size: 19px;
  box-shadow: 0 3px 0 var(--lilac-deep); white-space: nowrap; }
.pill.goal { background: var(--paper); box-shadow: 0 3px 0 rgba(200,140,90,0.45); font-size: 17px; color: var(--ink-soft); }
.pill.goal::before, .pill.goal::after { content: "~"; color: var(--ink-soft); opacity: 0.7; }
#timer svg { width: 20px; height: 20px; }
#timer.low { background: #FFC9C9; box-shadow: 0 3px 0 #F09A9A; color: var(--alert); animation: thump 1s infinite; }
@keyframes thump { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.08); } }
#hard { background: var(--alert); color: #fff; font-weight: 700; padding: 3px 12px; border-radius: 10px; font-size: 14px; letter-spacing: 1px; box-shadow: 0 3px 0 #A92B33; }
#hard.pop { animation: pop 0.5s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { from { transform: scale(0.3); } to { transform: scale(1); } }
.big { font-size: 40px; font-weight: 700; color: var(--pink); }
#gear { pointer-events: auto; position: absolute; right: calc(max(12px, env(safe-area-inset-right, 0px)) + max(0px, 50vw - 240px)); top: calc(env(safe-area-inset-top, 0px) + 12px); width: 40px; height: 40px;
  border-radius: 50%; border: 0; background: var(--paper); box-shadow: 0 3px 0 rgba(200,140,90,0.45); display: grid; place-items: center; cursor: pointer; }
#gear svg { width: 22px; height: 22px; }
#bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; pointer-events: auto; }
.bt { position: relative; border: 0; border-radius: 18px; padding: 6px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;
  font: 600 18px/1 var(--font); color: var(--ink); box-shadow: 0 5px 0 rgba(150,80,60,0.28); transition: transform 0.12s; }
.bt:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(150,80,60,0.28); }
.bt img { height: 46px; width: auto; max-width: 90%; object-fit: contain; pointer-events: none; }
.bt.unfold { background: var(--butter); } .bt.eraser { background: var(--rose); } .bt.undo { background: var(--mint); }
.bt .n { position: absolute; top: -7px; right: -5px; min-width: 22px; height: 22px; padding: 0 5px; box-sizing: border-box; border-radius: 11px; background: var(--ink); color: #fff;
  font-size: 13px; line-height: 22px; text-align: center; }
.bt.active { outline: 3px solid #fff; outline-offset: 2px; animation: wob 0.7s infinite; }
@keyframes wob { 50% { transform: translateY(-3px); } }
body.aiming #stage { cursor: crosshair; }
.card-wrap { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; background: rgba(80,30,60,0.35); padding: 16px; }
.card { background: var(--paper); border-radius: 22px; padding: 22px 22px 18px; width: min(320px, 88vw); text-align: center; box-shadow: 0 8px 0 rgba(150,70,40,0.3);
  display: flex; flex-direction: column; gap: 12px; }
.card h2 { margin: 0; font-size: 30px; color: var(--ink); text-wrap: balance; }
.card p { margin: 0; font-size: 16px; color: var(--ink-soft); }
.card button { border: 0; border-radius: 14px; padding: 12px; font: 600 20px var(--font); cursor: pointer; color: var(--ink); background: var(--mint); box-shadow: 0 4px 0 rgba(60,140,110,0.35); }
.card button.alt { background: var(--lilac); box-shadow: 0 4px 0 var(--lilac-deep); }
.card button:focus-visible, .bt:focus-visible, #gear:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.flycoin { position: fixed; z-index: 6; width: 28px; height: 28px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFF2A8, #F5C22E 55%, #C99312); box-shadow: 0 0 0 2px #fff; pointer-events: none; }
.credit { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
@media (max-height: 640px) { .banner { font-size: 26px; } .pill { font-size: 16px; padding: 4px 10px; } .bt img { height: 34px; } .bt { font-size: 15px; } }
@media (prefers-reduced-motion: reduce) { #timer.low, .bt.active { animation: none; } }

// A rod (screw / pencil / needle) lies on a grid along U/D/L/R. Its "head" leads when it is pulled out;
// the shaft trails behind. It slides along its own axis both ways until it touches something.
//  - Wood = a live single block (animal / yarn wrap) or a live plank cell (caterpillar / rope).
//  - The head never enters wood; when pushed deeper, the tail never drills into new wood or leaves the board.
//  - Rods never overlap, except two rods crossing inside one single block.
//  - A rod pulled OUT of a single block breaks that block.
//  - A plank stays while any rod goes through it and drops with its last one.
//  - A rod that goes through no live wood comes out (the moved rod) or falls off (any other rod).

  function Game(level) {
    this.level = level;
    this.w = level.w; this.h = level.h;

  }

  P.cellsAt = function (r, pos) {
    const hx = r.x + r.dx * pos, hy = r.y + r.dy * pos, out = [];

    return out;
  };
  P.cells = function (r) { return this.cellsAt(r, r.pos); };
  P.woodAt = function (x, y) {

      if (st.br > 0.38) { const k = Math.min(1, (st.br - 0.38) / 0.4); rot += k * 1.1 * (h > 0.5 ? 1 : -1); dy -= E.inCubic(k) * c * 2.4; dx += (h > 0.5 ? 1 : -1) * k * c * 1.2; al = 1 - k; }
      if (al <= 0) return;
      const sx = st.shake ? Math.sin(performance.now() / 15) * st.shake * c * 0.05 : 0;
      Sh.drawImg(ctx, im, B.cx(b.x) + dx + sx, B.cy(b.y) + dy, c * 1.16 * sc, c * 1.16 * sc, rot, al);
    },
    drawRod(ctx, B, r, v) { drawPencil(ctx, B, r, v); },
    drawTop(ctx, B, b, st, T) {
      const ph = Sh.hash(b.y, b.x) * 6.28, breathe = Math.sin(T * 2.2 + ph) * B.cell * 0.012;
      const sx = st.shake ? Math.sin(T * 60) * st.shake * B.cell * 0.06 : 0;
      palDraw(ctx, B, b, poseFor(b, true), st.pop, { dx: sx, dy: breathe });
    },
    drawBreak(ctx, B, b, t, T, g) {
      // let go (lift), unfold into a creased paper square, then flutter away with the note
      const c = B.cell, pose = g && g.horiz === false ? 'hug' : 'sit', dir = Sh.hash(b.x + 3, b.y) > 0.5 ? 1 : -1;
      if (t < 0.15) { palDraw(ctx, B, b, pose, 1 + 0.08 * (t / 0.15), { dy: -c * 0.18 * (t / 0.15) }); return; }
      const unf = Sh.img['unf' + (b.look % 4)];
      if (t < 0.38) {
        const k = (t - 0.15) / 0.23;
        if (k < 0.5) { ctx.save(); ctx.translate(B.cx(b.x), B.cy(b.y) - c * 0.18); ctx.scale(1 - k * 2, 1); ctx.translate(-B.cx(b.x), -B.cy(b.y) + c * 0.18); palDraw(ctx, B, b, pose, 1.08, { dy: -c * 0.18 }); ctx.restore(); }
        else { const s = (k - 0.5) * 2; Sh.drawImg(ctx, unf, B.cx(b.x), B.cy(b.y) - c * 0.18, c * 1.05 * s, c * 1.05, 0, 1); }
        return;
      }
      const k = Math.min(1, (t - 0.38) / 0.42);
      Sh.drawImg(ctx, unf, B.cx(b.x) + dir * E.inCubic(k) * c * 1.2, B.cy(b.y) - c * 0.18 - E.inCubic(k) * c * 2.6, c * 1.05 * (1 - 0.3 * k), c * 1.05 * (1 - 0.3 * k), dir * k * 1.3, 1 - Math.max(0, (k - 0.5) * 2));
    },
    drawPlank() {},
    onBreak(B, b, x, y) {
      const c = B.cell;
      Sh.burst(x, y - c * 0.3, 10, { speed: c * 3.2, life: 0.7, size: c * 0.12, gravity: c * 5, colors: [PAL_COL[b.look % 4], NOTE_COL[Math.floor(Sh.hash(b.x, b.y) * 4) % 4], '#FFFFFF'], kind: 'square', spin: 10 });
      Sh.burst(x, y - c * 0.6, 4, { speed: c * 1.6, life: 0.6, size: c * 0.24, gravity: 0, colors: ['#FFE27A', '#FFFFFF'], kind: 'star', angle: -Math.PI / 2, spread: Math.PI * 0.8 });
    },
    onBump(B, x, y) { Sh.burst(x, y, 5, { speed: B.cell * 2.2, life: 0.35, size: B.cell * 0.09, gravity: 0, colors: ['#FFFFFF', '#FFE27A'], kind: 'tri' }); },
    onErase(B, r, e) { for (let k = 0; k < 4; k++) { const t = k / 3; Sh.burst(Sh.lerp(e.hx, e.tx, t), Sh.lerp(e.hy, e.ty, t), 5, { speed: B.cell * 2, life: 0.6, size: B.cell * 0.1, gravity: B.cell * 6, colors: ['#F7A8C0', '#F48FB1', '#FFFFFF'], kind: 'round' }); } },
    onBoosterFly(B, id, b) { Sh.burst(B.cx(b.x), B.cy(b.y), 10, { speed: B.cell * 3, life: 0.6, size: B.cell * 0.25, colors: ['#FFE27A', '#FFFFFF', '#F7A8C0'], kind: 'star' }); },
    onWin(B) {
      const c = B.cell, cx = B.x0 + B.w * c / 2;
      for (let k = 0; k < 4; k++) setTimeout(() => Sh.burst(cx + (k - 1.5) * c * 1.4, B.y0 + c * 0.5, 20, { speed: c * 5, life: 1.5, size: c * 0.15, gravity: c * 6, colors: ['#F7A8C0', '#C7A8EE', '#9FDEC0', '#F8DE7A', '#F47A1F', '#2D5FDB'], kind: k % 2 ? 'tri' : 'square', angle: -Math.PI / 2, spread: Math.PI * 0.9, spin: 12 }), k * 90);
    },
  };
  G.PaperPalsSkin = skin;
})(window);
</script>
<script>
Shell.snd.init(window.SOUNDS);
Shell.loadImages(window.ASSETS).then(() => SlideApp(PaperPalsSkin, window.LEVELS));
</script>
