#hud { display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 3; position: relative; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; }
.pill { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px 0 4px; border-radius: 20px; background: var(--pill); color: var(--cream);
  box-shadow: inset 0 2px 3px rgba(0,0,0,0.35); font-weight: 600; font-size: 22px; font-variant-numeric: tabular-nums; }
.pill img { width: 40px; height: 40px; object-fit: contain; margin-left: -8px; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3)); }
#timer.low { color: #FFB0A8; animation: thump 1s infinite; }
@keyframes thump { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.07); } }
#gear { pointer-events: auto; width: 44px; height: 44px; border: 0; border-radius: 50%; background: transparent; padding: 0; cursor: pointer; }
#gear img { width: 44px; height: 44px; object-fit: contain; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3)); }
.lvl { display: flex; align-items: center; gap: 12px; font-weight: 600; font-style: italic; font-size: 22px; color: var(--ink); }
.lvl::before, .lvl::after { content: ""; width: 70px; height: 1.5px; background: linear-gradient(90deg, transparent, rgba(90,52,24,0.55)); }
.lvl::after { transform: scaleX(-1); }
#hard { background: var(--alert); color: #fff; font-weight: 700; padding: 2px 10px; border-radius: 9px; font-size: 13px; letter-spacing: 1px; }
#hard.pop { animation: pop 0.5s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { from { transform: scale(0.3); } to { transform: scale(1); } }
#boardArea { flex: 1; min-height: 0; margin-top: 6px; }
#caption { height: 40px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-style: italic; font-size: 25px; color: var(--cream);
  text-shadow: 0 2px 3px rgba(0,0,0,0.5); opacity: 0; transform: translateY(6px); transition: opacity .3s, transform .3s; white-space: nowrap; }
#caption.on { opacity: 1; transform: none; }
.card-wrap { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; background: rgba(20,8,2,0.5); padding: 16px; }
.card { background: var(--cream); color: var(--ink); border-radius: 22px; padding: 22px 22px 18px; width: min(320px, 88vw); text-align: center;
  box-shadow: 0 0 0 6px var(--frame), 0 10px 0 6px var(--frame-deep); display: flex; flex-direction: column; gap: 12px; }
.card h2 { margin: 0; font-size: 30px; text-wrap: balance; }
.card p { margin: 0; font-size: 16px; color: #8A5A34; }
.big { font-size: 38px; font-weight: 700; color: #C98A12; }
.card button { border: 0; border-radius: 14px; padding: 12px; font: 600 20px var(--font); cursor: pointer; color: #fff; background: var(--green); box-shadow: 0 4px 0 #23683A; }

.credit { font-size: 12px; margin-top: 4px; }

<script>// Slide rules (Screw Master family), shared by Paper Pals and Needle & Yarn.
// A rod (screw / pencil / needle) lies on a grid along U/D/L/R. Its "head" leads when it is pulled out;
// the shaft trails behind. It slides along its own axis both ways until it touches something.
//  - Wood = a live single block (animal / yarn wrap) or a live plank cell (caterpillar / rope).
//  - The head never enters wood; when pushed deeper, the tail never drills into new wood or leaves the board.
//  - Rods never overlap, except two rods crossing inside one single block.
//  - A rod pulled OUT of a single block breaks that block.
//  - A plank stays while any rod goes through it and drops with its last one.
//  - A rod that goes through no live wood comes out (the moved rod) or falls off (any other rod).
(function (G) {
  'use strict';
  const DIR = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };
  const K = (x, y) => (x + 64) * 1024 + (y + 64);

  function Game(level) {
    this.level = level;
    this.w = level.w; this.h = level.h;
    this.noFall = !!level.noFall;
    this.bothWays = !!level.bothWays; // pieces slide out either way; only pieces in the way stop them (Paper Pals)   // pieces left holding nothing stay until dragged out (Needle and Yarn)
    this.rods = level.rods.map((r, i) => ({
      i, x: r.x, y: r.y, d: r.d, dx: DIR[r.d][0], dy: DIR[r.d][1], len: r.len,
      color: r.color | 0, pos: r.start | 0, gone: false, how: null,
    }));
    this.blocks = level.blocks.map((b, j) => ({ j, x: b.x, y: b.y, plank: b.plank | 0, alive: true, look: b.look | 0, horiz: b.horiz }));
    // a plank's direction comes from its own cells (the stored flag can be missing)
    for (const b of this.blocks) if (b.plank) { const mates = this.blocks.filter(o => o.plank === b.plank); b.horiz = mates.every(o => o.y === mates[0].y); }
    this.blockAt = new Map();
    for (const b of this.blocks) this.blockAt.set(K(b.x, b.y), b);
    this.plankAlive = {};
    for (const b of this.blocks) if (b.plank) this.plankAlive[b.plank] = true;
  }
  const P = Game.prototype;

  P.cellsAt = function (r, pos) {
    const hx = r.x + r.dx * pos, hy = r.y + r.dy * pos, out = [];
    for (let k = 0; k < r.len; k++) out.push([hx - r.dx * k, hy - r.dy * k]);
    return out;
  };
  P.cells = function (r) { return this.cellsAt(r, r.pos); };
  P.woodAt = function (x, y) {
    const b = this.blockAt.get(K(x, y));
    if (!b) return null;
    if (b.plank) return this.plankAlive[b.plank] ? b : null;
    return b.alive ? b : null;
  };
  P.occ = function (except) {
    const m = new Map();
    for (const r of this.rods) {
      if (r.gone || r.i === except) continue;
      for (const [x, y] of this.cells(r)) {
        const k = K(x, y);
        if (!m.has(k)) m.set(k, []);
        m.get(k).push(r.i);
      }
    }
    return m;
  };
  P.threadsAt = function (r, pos) {
    for (const [x, y] of this.cellsAt(r, pos)) if (this.woodAt(x, y)) return true;
    return false;
  };
  P.inBoard = function (x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h; };

  // How far rod i can go from where it is now: {min<=0, max>=0, exitAt (offset delta where it comes out, or null),
  // stopFwd / stopBack: what it would touch next ({kind:'rod'|'wood'|'edge', x, y, id})}
  P.limits = function (i) {
    const r = this.rods[i], occ = this.occ(i);
    let max = 0, exitAt = null, stopFwd = null;
    for (let k = 1; k <= 24; k++) {
      const p = r.pos + k, hx = r.x + r.dx * p, hy = r.y + r.dy * p;
      const o = occ.get(K(hx, hy));
      if (o) { stopFwd = { kind: 'rod', x: hx, y: hy, id: o[0] }; break; }
      const w = this.woodAt(hx, hy);
      if (w) { stopFwd = { kind: 'wood', x: hx, y: hy, id: w.j }; break; }
      max = k;
      if (!this.threadsAt(r, p)) { exitAt = k; break; }
    }
    let min = 0, stopBack = null, exitBackAt = null;
    for (let k = 1; k <= 24; k++) {
      const p = r.pos - k;
      const hx = r.x + r.dx * p, hy = r.y + r.dy * p;
      const tx = hx - r.dx * (r.len - 1), ty = hy - r.dy * (r.len - 1);
      if (!this.bothWays && !this.inBoard(tx, ty)) { stopBack = { kind: 'edge', x: tx, y: ty }; break; }
      const o = occ.get(K(tx, ty));
      if (o) { stopBack = { kind: 'rod', x: tx, y: ty, id: o[0] }; break; }
      const wt = this.woodAt(tx, ty);
      if (wt) { stopBack = { kind: 'wood', x: tx, y: ty, id: wt.j }; break; }
      if (!this.bothWays) { const wh = this.woodAt(hx, hy); if (wh) { stopBack = { kind: 'wood', x: hx, y: hy, id: wh.j, head: true }; break; } }

      if (this.bothWays && !this.threadsAt(r, p)) { exitBackAt = k; break; }
    }

  };

  // Move rod i by one cell (+1 out, -1 deeper). Returns the events it caused.
  P.step = function (i, dir) {
    const r = this.rods[i];
    const before = this.cells(r);
    r.pos += dir; r.lastDir = dir;
    const ev = [];
    if (dir > 0 || this.bothWays) {
      const now = new Set(this.cells(r).map(([x, y]) => K(x, y)));
      for (const [x, y] of before) {
        if (now.has(K(x, y))) continue;
        const b = this.blockAt.get(K(x, y));
        if (b && !b.plank && b.alive) { b.alive = false; ev.push({ type: 'break', block: b.j, by: i }); }
      }
    }
    this.settle(ev, i);
    return ev;
  };

  P.settle = function (ev, moved) {
    for (let guard = 0; guard < 50; guard++) {
      let changed = false;
      // planks with no rod left in them drop
      const occ = this.occ(-1);
      for (const id in this.plankAlive) {
        if (!this.plankAlive[id]) continue;
        let held = false;
        for (const b of this.blocks) if (b.plank == id && occ.has(K(b.x, b.y))) { held = true; break; }
        if (!held) { this.plankAlive[id] = false; ev.push({ type: 'plank', plank: +id }); changed = true; }
      }
      // a holder (single block) with no rod left through it lets go too (e.g. after an eraser)
      for (const b of this.blocks) {
        if (b.plank || !b.alive) continue;
        if (!occ.has(K(b.x, b.y))) { b.alive = false; ev.push({ type: 'break', block: b.j, by: -1 }); changed = true; }
      }
      // rods that go through no live wood come out / fall off
      for (const r of this.rods) {
        if (r.gone) continue;
        if (!this.threadsAt(r, r.pos)) {
          if (r.i !== moved && this.noFall) continue;
          r.gone = true; r.how = r.i === moved ? 'out' : 'fall';
          ev.push({ type: r.how, rod: r.i });
          changed = true;
        }
      }
      if (!changed) break;
    }
  };

  P.moveTo = function (i, target) {
    const ev = [], r = this.rods[i];
    while (!r.gone && r.pos !== target) {
      const e = this.step(i, target > r.pos ? 1 : -1);
      for (const x of e) ev.push(x);
    }
    return ev;
  };

  P.done = function () { return this.rods.every(r => r.gone); };
  P.live = function () { return this.rods.filter(r => !r.gone); };

  P.snap = function () {
    return {
      pos: this.rods.map(r => r.pos), gone: this.rods.map(r => r.gone), how: this.rods.map(r => r.how),
      alive: this.blocks.map(b => b.alive), plank: Object.assign({}, this.plankAlive),
    };
  };
  P.restore = function (s) {
    this.rods.forEach((r, k) => { r.pos = s.pos[k]; r.gone = s.gone[k]; r.how = s.how[k]; });
    this.blocks.forEach((b, k) => { b.alive = s.alive[k]; });
    this.plankAlive = Object.assign({}, s.plank);
  };
  P.key = function () {
    let s = '';
    for (const r of this.rods) s += r.gone ? 'x' : String.fromCharCode(80 + r.pos);
    s += '|';
    for (const b of this.blocks) if (!b.plank) s += b.alive ? '1' : '0';
    for (const id in this.plankAlive) s += this.plankAlive[id] ? '1' : '0';
    return s;
  };

  // Breadth-first search over macro moves (slide one rod to any reachable offset). Returns
  // {moves:[{i, to, delta, kind:'out'|'slide'|'push'}], states} or null.
  function solve(level, opts) {
    opts = opts || {};
    const cap = opts.cap || 250000;
    const g = new Game(level);
    if (opts.from) g.restore(opts.from);
    const start = g.snap(), startKey = g.key();
    if (g.done()) return { moves: [], states: 1 };
    const seen = new Map([[startKey, null]]);
    let frontier = [start];
    while (frontier.length) {
      const next = [];
      for (const s of frontier) {
        g.restore(s);
        const sk = g.key();
        for (const r of g.rods) {
          if (s.gone[r.i]) continue;
          g.restore(s);
          const lim = g.limits(r.i);
          for (let t = lim.min; t <= lim.max; t++) {
            if (t === 0) continue;
            g.restore(s);
            g.moveTo(r.i, s.pos[r.i] + t);
            const k = g.key();
            if (seen.has(k)) continue;
            const exited = g.rods[r.i].gone;
            seen.set(k, { prev: sk, i: r.i, to: s.pos[r.i] + t, delta: t, kind: exited ? 'out' : (t > 0 ? 'slide' : 'push') });
            if (g.done()) {
              const moves = [];
              let cur = k;
              while (seen.get(cur)) { const m = seen.get(cur); moves.push({ i: m.i, to: m.to, delta: m.delta, kind: m.kind }); cur = m.prev; }
              moves.reverse();
              return { moves, states: seen.size };
            }
            next.push(g.snap());
            if (seen.size > cap) return null;
          }
        }
      }
      frontier = next;
    }
    return { moves: null, states: seen.size }; // unsolvable
  }

  // ---------- level generator (hill-climb toward a target) ----------
  function rng(seed) {
    let s = seed >>> 0 || 1;
    return function () { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  }

        if (k >= st.ticks) { st.ticks = k + 1; G.Shell.snd.play('tap', { vol: 0.45, rate: 1.05 + k * 0.06 }); }
      }
      // the yarn from the last stitch to the needle's eye, until the needle has gone
      if (g.snap == null && eye) {
        ctx.globalAlpha = 1; ctx.strokeStyle = col; ctx.lineWidth = c * 0.07;
        ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(eye.x, eye.y); ctx.stroke();
      } else if (g.snap != null && t - g.snap < 0.2) {   // the cut end springs back
        const k = (t - g.snap) / 0.2, ex = lastX + d[0] * c * 0.5 * (1 - k), ey = lastY + d[1] * c * 0.5 * (1 - k);
        ctx.globalAlpha = 1 - k; ctx.strokeStyle = col; ctx.lineWidth = c * 0.07;
        ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.quadraticCurveTo(ex - d[1] * c * 0.2, ey + d[0] * c * 0.2, ex, ey); ctx.stroke();
      }
      ctx.restore();
      if (tight > 0) {
        coil(ctx, B, kx, ky, b.look, tight, horiz);
        sparkleRays(ctx, B, kx, ky, (t - g.snap - 0.35) / 0.4);
        if (tight >= 1 && !st.done) { st.done = true; st.doneT = t; G.Shell.snd.play('place', { vol: 0.6 }); }
      }
    },
    drawPlank(ctx, B, p, st) {
      const c = B.cell, cells = p.cells.slice().sort((a, b) => p.horiz ? a.x - b.x : a.y - b.y);
      const im = Sh.img['rope' + ((p.id - 1) % 3)];
      if (!im) return;
      const a0 = cells[0], a1 = cells[cells.length - 1];
      const cx = (B.cx(a0.x) + B.cx(a1.x)) / 2, cy = (B.cy(a0.y) + B.cy(a1.y)) / 2;
      const len = cells.length * c + c * 0.3, th = c * 0.52;
      let sy = 1, al = 1;
      if (st.t >= 0) { const k = Math.min(1, st.t / 0.3); sy = 1 - 0.65 * E.inCubic(k); al = 1 - k; if (!ropeSewn[p.id]) ropeSewn[p.id] = { cells, horiz: p.horiz, t: performance.now() - st.t * 1000 };
        for (const cl of cells) coil(ctx, B, B.cx(cl.x), B.cy(cl.y), ROPE_COIL[(p.id - 1) % 3], Sh.clamp((st.t - 0.15) / 0.3, 0, 1), p.horiz); }
      if (al <= 0) return;
      ctx.save(); ctx.globalAlpha *= al; ctx.translate(cx, cy); if (!p.horiz) ctx.rotate(Math.PI / 2);
      ctx.scale(st.pop, st.pop * sy);
      ctx.shadowColor = 'rgba(50,25,8,0.35)'; ctx.shadowBlur = c * 0.16; ctx.shadowOffsetY = c * 0.07;
      ctx.drawImage(im, -len / 2, -th / 2, len, th); ctx.restore();
    },
    onBreak(B, b, x, y) {
      sewnAt[b.j] = null; delete sewnAt[b.j];
      Sh.burst(x, y, 7, { speed: B.cell * 1.8, life: 0.6, size: B.cell * 0.13, gravity: 0, colors: [YARN[b.look % 6], '#FFFFFF'], kind: 'fluff', drag: 0.92 });

    },
    onPlank(B, id) { G.Shell.snd.play('place', { vol: 0.7, delay: 0.2 }); },
    onBump(B, x, y) { Sh.burst(x, y, 6, { speed: B.cell * 2.2, life: 0.35, size: B.cell * 0.12, gravity: 0, colors: ['#FFFFFF', '#FFE9A8'], kind: 'star' }); },
    onWin(B, g) {
      const c = B.cell;
      g.blocks.filter(b => !b.plank).forEach((b, k) => setTimeout(() => Sh.burst(B.cx(b.x), B.cy(b.y), 5, { speed: c * 1.6, life: 0.7, size: c * 0.2, colors: ['#FFE27A', '#FFFFFF'], kind: 'star' }), k * 60));
    },
  };
  G.NeedleYarnSkin = skin;
})(window);
</script>
<script>
Shell.snd.init(window.SOUNDS);
Shell.loadImages(window.ASSETS).then(() => SlideApp(NeedleYarnSkin, window.LEVELS));
</script>
