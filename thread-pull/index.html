#hud { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; }
.pill { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px 0 4px; border-radius: 20px; background: var(--pill);
  box-shadow: inset 0 0 0 1.5px rgba(255,214,160,0.2), 0 3px 8px rgba(0,0,0,0.3); font-weight: 600; font-size: 22px; font-variant-numeric: tabular-nums; }
.pill img { width: 40px; height: 40px; object-fit: contain; margin-left: -8px; }
#timer.low { color: #FFB0A8; animation: thump 1s infinite; }
@keyframes thump { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.07); } }
#gear { pointer-events: auto; width: 46px; height: 46px; border: 0; border-radius: 50%; background: transparent; padding: 0; cursor: pointer; }
#gear img { width: 46px; height: 46px; object-fit: contain; filter: drop-shadow(0 3px 3px rgba(0,0,0,0.35)); }
.lvl { margin-top: 4px; font-weight: 600; font-size: 21px; color: var(--cream-soft); text-shadow: 0 2px 2px rgba(0,0,0,0.4); }
.goal { font-weight: 700; font-style: italic; font-size: 27px; color: var(--cream); text-shadow: 0 2px 3px rgba(0,0,0,0.45); }
#hard { background: var(--alert); color: #fff; font-weight: 700; padding: 2px 10px; border-radius: 9px; font-size: 13px; letter-spacing: 1px; }
#boardArea { flex: 1; min-height: 0; }
.foot { display: flex; align-items: center; justify-content: center; gap: 16px; min-height: 64px; }

#callout { position: fixed; z-index: 4; transform: translate(-50%, -50%) scale(0.7); opacity: 0; pointer-events: none; transition: opacity .2s, transform .3s cubic-bezier(.3,1.5,.5,1); }
#callout.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
#callout b { display: block; background: var(--cream); color: #4A2A14; font-size: 18px; font-weight: 700; font-style: italic; padding: 7px 14px; border-radius: 12px;
  box-shadow: 0 0 0 1.5px #C9A77A, 0 4px 10px rgba(0,0,0,0.35); white-space: nowrap; }
#calloutDot { position: fixed; z-index: 4; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px #5A3418; opacity: 0; pointer-events: none; transition: opacity .2s; }
#calloutDot.on { opacity: 1; }
.card-wrap { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; background: rgba(20,8,2,0.5); padding: 16px; }
.card { background: var(--cream); color: var(--ink); border-radius: 22px; padding: 22px 22px 18px; width: min(320px, 88vw); text-align: center;
  box-shadow: 0 0 0 6px var(--wood), 0 10px 0 6px var(--wood-deep); display: flex; flex-direction: column; gap: 12px; }
.card h2 { margin: 0; font-size: 30px; text-wrap: balance; }
.card p { margin: 0; font-size: 16px; color: #8A5A34; }
.big { font-size: 38px; font-weight: 700; color: #C98A12; }
.card button { border: 0; border-radius: 14px; padding: 12px; font: 600 20px var(--font); cursor: pointer; color: #fff; background: var(--green); box-shadow: 0 4px 0 #23683A; }
.card button.alt { background: var(--wood); box-shadow: 0 4px 0 var(--wood-deep); }
.card button:focus-visible, #gear:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.credit { font-size: 12px; margin-top: 4px; }
@media (max-height: 700px) { .goal { font-size: 21px; } .pill { height: 34px; font-size: 18px; } .pill img { width: 34px; height: 34px; } .foot { min-height: 50px; } .swatch { width: 46px; height: 46px; padding: 8px; } }

        ctx.restore();
